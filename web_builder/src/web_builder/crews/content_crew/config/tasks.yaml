frontend_ui_task:
  description: >
    Execute the assigned task using its specification as the work contract.

    Mandatory workflow:
    1. Read AGENTS.md.
    2. MANDATORY DESIGN INSPECTION STEP:
       - Read design/DESIGN_SYSTEM.md to understand the Stitch design tokens, colors, and screen directory.
       - You MUST use `read_file` to inspect ONLY the specific Stitch mockup file `code.html` in '{design_dir}' relevant to the page(s) required in {target_phase}:
         * If implementing Login: design/screen_login/code.html
         * If implementing POS Cashier / Cart / Checkout: design/screen_pos_cashier/code.html
         * If implementing Manager Dashboard: design/screen_dashboard_overview/code.html
         * If implementing Orders: design/screen_orders_management/code.html
         * If implementing Menu & Products: design/screen_products_menu/code.html
         * If implementing Inventory & Stock: design/screen_inventory_stock/code.html
         * If implementing Reports: design/screen_reports_revenue/code.html
         (DO NOT read all 7 screen mockups at once to prevent token limit truncation).
       - Read the HTML structure, color classes, typography classes, spacing tokens, and Material Symbols Outlined icons from that specific `code.html`.
       - DO NOT invent generic or dark themes (NO bg-stone-900, NO bg-stone-950).
       - ALWAYS use the warm cafe theme tokens from Stitch (bg-background, bg-surface-container-*, text-primary, bg-primary, text-on-primary, etc.).
       - Use Google Material Symbols Outlined icons (<span className="material-symbols-outlined">...</span>) matching the Stitch design.
       - Read state/HANDOFF.md for verified API endpoints and types from FE-1.
    3. Inspect the current repository, layout components (Sidebar, TopHeader, POS Layout), and existing pages.
    4. Resolve dependencies and connect UI components with authenticated API services.
    5. Implement only the authorized scope:
       - Responsive React/TypeScript pages, components, and modals inheriting directly from the Stitch code.html markup.
       - Mandatory API Integration: In pages (Login, CashierPOS, ManagerDashboard), you MUST import `api` from `../services/api`. Wire dynamic state using React `useEffect` to fetch real data from backend endpoints (`api.getCategories()`, `api.getProducts()`, `api.createOrder()`, `api.getOrders()`). Never leave pages with only hardcoded static mock items. Always include resilient fallback to initial defaults if the backend is offline.
       - Format all currency in Zero-Float VND format (e.g. 45.000 ₫, never USD $).
       - Write all source files directly to disk using `write_file`, `replace_lines`, or `patch_file`.
    6. Verify every acceptance criterion:
       - Execute `run_command(command="npm run build", cwd="frontend")` and verify 0 TypeScript and Vite compilation errors.
       - If any build error occurs, you MUST modify the offending code using `replace_lines`, `patch_file`, or `write_file` before re-running the build. The ANTI-LOOP GUARD blocks re-running on unmodified files.
    7. Report actual test results and changed files.
    8. Prepare a structured handoff:
       - Update state/PROJECT_STATE.md with task status.
       - Record completed UI components and routes in state/HANDOFF.md for QA verification.

    Do not invent missing requirements.
    Do not claim unverified success.
    Do not overwrite unrelated changes.

    Assigned task: {target_phase} - FE-2: UI Pages, Components & Design System Layout
    Task specification: plans/TASKS.md & design/DESIGN_SYSTEM.md
    State file: state/PROJECT_STATE.md
    Handoff file: state/HANDOFF.md
  expected_output: >
    Structured execution report containing:
    - Task ID and status
    - Implementation summary
    - Changed files
    - Acceptance criteria and verification evidence
    - Commands and actual test results (npm run build)
    - Deviations, blockers, and next actions
  agent: frontend

