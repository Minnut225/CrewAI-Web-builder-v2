# ==============================================================================
# tasks.yaml - Autonomous Software Engineering Work Breakdown Structure & Tasks
# Standardized according to AGENTS.md, docs/, design/, plans/, state/, and qa/
# ==============================================================================

# ------------------------------------------------------------------------------
# STAGE 1: BA Requirement Analysis & Atomic Task Decomposition
# ------------------------------------------------------------------------------
ba_decomposition_task:
  description: >
    Execute the assigned task using its specification as the work contract.

    Mandatory workflow:
    1. Read AGENTS.md.
    2. Read the assigned task file and all referenced specifications:
       - docs/PRD.md (Product requirements and scope)
       - docs/ARCHITECTURE.md (System architecture, stack and components)
       - docs/DATA_MODEL.md (Entities, relationships, constraints, migrations)
       - docs/API_CONTRACTS.md (Endpoints, schemas, validations, errors, examples)
       - docs/BUSINESS_RULES.md (Business rules, formulas, and edge cases)
       - design/DESIGN_SYSTEM.md (Colors, typography, spacing, components, POS layout)
       - plans/IMPLEMENT_PLAN.md (Milestones, dependencies, implementation sequence)
       - plans/TASKS.md (Task list with IDs, owners, statuses, acceptance criteria)
       - qa/TEST_PLAN.md (Test strategy and acceptance criteria)
    3. Inspect the current repository, existing changes, and state files (state/PROJECT_STATE.md, state/HANDOFF.md).
    4. Resolve dependencies, identify missing specifications, and align with milestone roadmaps.
    5. Implement only the authorized scope: Decompose '{target_phase}' (Scope: {phase_scope}) into atomic sub-tasks:
       - Task BE-1 (Models, Schemas & Data Contracts): Database models, migration scripts, Pydantic/DTO schemas. Enforce Zero-Float precision for currency.
       - Task BE-2 (Business Logic & Services): Domain services and business logic. Enforce ACID transactions, snapshot pricing, and data integrity.
       - Task BE-3 (API Routers, Auth & Tests): REST API endpoints, RBAC dependencies, and automated unit/integration tests (pytest).
       - Task FE-1 (Types & API Client Services): TypeScript interfaces matching backend schemas 1:1, authenticated API client services.
       - Task FE-2 (UI Pages, Components & POS Layout): Responsive components adhering to design/DESIGN_SYSTEM.md and Stitch specifications.
       - Task QA-1 (Acceptance Verification Gate): Concrete, testable acceptance criteria from qa/TEST_PLAN.md.
    6. Verify every acceptance criterion against project contracts.
    7. Report actual work breakdown structure and changed files.
    8. Prepare a structured handoff: Update state/PROJECT_STATE.md and record specifications in state/HANDOFF.md.

    Do not invent missing requirements.
    Do not claim unverified success.
    Do not overwrite unrelated changes.

    Assigned task: {target_phase} - Architectural Analysis & Atomic Decomposition
    Task specification: docs/PRD.md & plans/IMPLEMENT_PLAN.md
    State file: state/PROJECT_STATE.md
    Handoff file: state/HANDOFF.md

    REQUIRED OUTPUT FORMAT:
    Output a detailed Markdown execution report ending with a SINGLE fenced JSON code block with the EXACT schema:
    ```json
    {
      "phase_name": "{target_phase}",
      "summary": "High-level architectural summary of the phase",
      "backend_tasks": [
        {
          "task_id": "BE-1",
          "title": "Models, Schemas & Data Contracts",
          "target_files": ["backend/app/models/...", "backend/app/schemas/..."],
          "details": "Specific entity fields, schema contracts, migration scripts"
        },
        {
          "task_id": "BE-2",
          "title": "Business Logic & Services (ACID & Precision)",
          "target_files": ["backend/app/services/..."],
          "details": "Domain service logic, transaction orchestration, business invariants"
        },
        {
          "task_id": "BE-3",
          "title": "API Routers, Security & Tests",
          "target_files": ["backend/app/api/v1/...", "backend/tests/..."],
          "details": "Endpoints, HTTP methods, RBAC rules, automated test cases"
        }
      ],
      "frontend_tasks": [
        {
          "task_id": "FE-1",
          "title": "TypeScript Types & API Services",
          "target_files": ["frontend/src/types/...", "frontend/src/services/..."],
          "details": "TypeScript interfaces matching backend schemas, API methods using api client"
        },
        {
          "task_id": "FE-2",
          "title": "UI Pages, Components & POS Layout",
          "target_files": ["frontend/src/pages/...", "frontend/src/components/..."],
          "details": "POS screen layout, Navigation, Header, Design system tokens"
        }
      ],
      "acceptance_criteria": [
        "Backend tests pass with 0 failures and 0 errors",
        "npm run build passes with 0 TypeScript/Vite errors",
        "Specific business rule criteria from qa/TEST_PLAN.md"
      ]
    }
    ```
  expected_output: >
    Structured execution report containing:
    - Task ID and status
    - Implementation summary
    - Changed files
    - Acceptance criteria and verification evidence
    - Commands and actual test results
    - Deviations, blockers, and next actions
    - Valid JSON block containing the decomposed atomic tasks
  agent: ba

