[project]
name = "web_builder"
version = "0.1.0"
description = "web_builder using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.22,<2.0.0"
]

[project.scripts]
kickoff = "web_builder.main:kickoff"
run_crew = "web_builder.main:kickoff"
plot = "web_builder.main:plot"
run_with_trigger = "web_builder.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "6bc8c529-739c-4478-8b84-43cb588232fc"
